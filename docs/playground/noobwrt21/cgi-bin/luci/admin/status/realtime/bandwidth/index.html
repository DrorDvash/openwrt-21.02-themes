<script type="text/javascript">//<![CDATA[
(function() {
	var KEY = 'noobwrt21.scheme';
	var root = document.documentElement;
	var link = document.getElementById('dark-theme-style');
	var themeToggle = document.getElementById('theme-toggle');
	var sunIcon = themeToggle.querySelector('.sun-icon');
	var moonIcon = themeToggle.querySelector('.moon-icon');
	var toolbarWrapper = document.getElementById('toolbar-wrapper');
	var pullTab = document.getElementById('toolbar-pull-tab');
	var scheme = window.matchMedia('(prefers-color-scheme: dark)');

	function saved() {
		try { return localStorage.getItem(KEY); } catch (e) { return null; }
	}

	function show(dark) {
		root.setAttribute('data-darkmode', dark ? 'true' : 'false');
		document.body.classList.toggle('dark-theme', dark);
		sunIcon.style.display  = dark ? 'none'  : 'block';
		moonIcon.style.display = dark ? 'block' : 'none';
	}

	/* no choice saved: follow the browser, also when it switches while the page is open */
	scheme.addEventListener('change', function(e) {
		if (!saved())
			show(e.matches);
	});
	show(root.getAttribute('data-darkmode') === 'true');

	themeToggle.addEventListener('click', function(e) {
		e.preventDefault();
		var dark = root.getAttribute('data-darkmode') !== 'true';
		link.media = dark ? 'all' : 'not all';
		try { localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (e) {}
		show(dark);
	});

	/* show the pages LuCI's menu has (the menu script loads it anyway; it is cached) */
	L.require('ui').then(function(ui) { return ui.menu.load(); }).then(function(tree) {
		document.querySelectorAll('#toolbar-menu a[data-path]').forEach(function(a) {
			var n = tree;
			a.getAttribute('data-path').split('/').forEach(function(p) { n = n && n.children && n.children[p]; });
			if (n && n.satisfied !== false)
				a.style.display = '';
		});
	});

	/* ---- Toolbar slide hide / show ---- */
	function applyToolbarState(hidden) {
		toolbarWrapper.classList.toggle('hidden', hidden);
		toolbarWrapper.classList.remove('peek');
		pullTab.setAttribute('aria-pressed', hidden ? 'true' : 'false');
		document.body.classList.toggle('toolbar-hidden', hidden);
	}

	/* no choice saved: shown on wider screens, only its tab on phones (it would cover content) */
	var state = null;
	try { state = localStorage.getItem('noobwrt21.toolbar'); } catch (e) {}
	applyToolbarState(state ? state === 'hidden' : window.matchMedia('(max-width: 768px)').matches);

	/* click the tab: hide / show for good */
	pullTab.addEventListener('click', function(e) {
		e.preventDefault();
		var hidden = !toolbarWrapper.classList.contains('hidden');
		applyToolbarState(hidden);
		try { localStorage.setItem('noobwrt21.toolbar', hidden ? 'hidden' : 'visible'); } catch (e) {}
	});

	/* hover while hidden: slide in for a peek, back out on leave */
	var peekTimeout = null;
	toolbarWrapper.addEventListener('mouseenter', function() {
		clearTimeout(peekTimeout);
		if (toolbarWrapper.classList.contains('hidden'))
			toolbarWrapper.classList.add('peek');
	});
	toolbarWrapper.addEventListener('mouseleave', function() {
		if (toolbarWrapper.classList.contains('hidden'))
			peekTimeout = setTimeout(function() { toolbarWrapper.classList.remove('peek'); }, 200);
	});
})();
/* phones: the floating button stands in for the header's hamburger (the header is hidden) */
(function() {
	var fab = document.getElementById('noob-menu-fab'), side = document.getElementById('mainmenu');
	if (!fab) return;
	fab.addEventListener('click', function() {
		var burger = document.querySelector('a.showSide');
		if (burger) burger.click();
		fab.setAttribute('aria-expanded', side && side.classList.contains('active') ? 'true' : 'false');
	});
	var mask = document.querySelector('.darkMask');
	if (mask) mask.addEventListener('click', function() { fab.setAttribute('aria-expanded', 'false'); });
})();
//]]></script>
