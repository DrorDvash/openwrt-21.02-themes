<!DOCTYPE html>
<html lang="en">
<head><script>window.__pg={"base":"/openwrt-21.02-themes/playground","home":"/openwrt-21.02-themes/","page":"login","theme":"uniwrt21"}</script><script src="/openwrt-21.02-themes/playground/pg-data.js"></script><script src="/openwrt-21.02-themes/playground/replay.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="u-meta-color" content="#131416">
  <title>Login - OpenWrt - LuCI</title>
  <link rel="icon" href="/openwrt-21.02-themes/playground/luci-static/uniwrt21/img/uniwrt-logo.svg?v=1.0.4-1" type="image/svg+xml">
  <link rel="stylesheet" href="/openwrt-21.02-themes/playground/luci-static/uniwrt21/css/cascade.css?v=1.0.4-1">
  <link rel="stylesheet" id="u-dark" href="/openwrt-21.02-themes/playground/luci-static/uniwrt21/css/dark.css?v=1.0.4-1" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/openwrt-21.02-themes/playground/luci-static/uniwrt21/css/theme.css?v=1.0.4-1">
  <script>
  (function(){
    var s; try{ s=localStorage.getItem('uniwrt21-theme'); }catch(e){}
    var mode=(s==='light'||s==='dark')?s:'auto', d=document.getElementById('u-dark'), m=document.getElementById('u-meta-color');
    if(d) d.media = mode==='dark' ? 'all' : (mode==='light' ? 'not all' : '(prefers-color-scheme: dark)');
    document.documentElement.dataset.theme=mode;
    var dark=mode==='dark'||(mode==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.darkmode=dark?'true':'false';
    if(m) m.content=dark?'#131416':'#ffffff';
  })();
  </script>
</head>
<body class="lang_en u-login-body">

<button class="u-iconbtn u-theme-toggle u-theme-float" id="u-theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
  <svg class="u-ico-auto"  viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7.25"/><path d="M9 1.75A7.25 7.25 0 019 16.25Z" fill="currentColor" stroke="none"/></svg>
  <svg class="u-ico-light" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.4"/><line x1="9" y1="1" x2="9" y2="3"/><line x1="9" y1="15" x2="9" y2="17"/><line x1="2.9" y1="2.9" x2="4.3" y2="4.3"/><line x1="13.7" y1="13.7" x2="15.1" y2="15.1"/><line x1="1" y1="9" x2="3" y2="9"/><line x1="15" y1="9" x2="17" y2="9"/><line x1="2.9" y1="15.1" x2="4.3" y2="13.7"/><line x1="13.7" y1="4.3" x2="15.1" y2="2.9"/></svg>
  <svg class="u-ico-dark"  viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 10A7 7 0 017 1.5 7.5 7.5 0 1015.5 10Z"/></svg>
</button>

<div class="u-login-wrap">
  <div class="u-login-card">
    <img class="u-login-logo" src="/openwrt-21.02-themes/playground/luci-static/uniwrt21/img/uniwrt-logo.svg?v=1.0.4-1" alt="">
    <h1 class="u-login-title">OpenWrt</h1>
    <p class="u-login-sub">Authorization Required</p>

    

    <form class="u-login-form" method="post">
      <label class="u-field">
        <span class="u-field-label">Username</span>
        <input type="text" name="luci_username" value="root" autocomplete="username">
      </label>
      <label class="u-field">
        <span class="u-field-label">Password</span>
        <input type="password" id="u-pw" name="luci_password" autocomplete="current-password">
      </label>
      <input type="submit" class="u-login-btn" value="Login">
    </form>

    <p class="u-login-ver">OX1d3x3 X UniWRT V2.0.38 (21.02 port)</p>
  </div>
</div>

<script>
  var pw=document.getElementById('u-pw'); if(pw) pw.focus();
  (function(){
    var btn=document.getElementById('u-theme-toggle'); if(!btn) return;
    var order=['auto','light','dark'];
    btn.addEventListener('click',function(){
      var cur=document.documentElement.dataset.theme||'auto';
      var next=order[(order.indexOf(cur)+1)%3];
      try{localStorage.setItem('uniwrt21-theme',next);}catch(e){}
      document.documentElement.dataset.theme=next;
      var d=document.getElementById('u-dark'),m=document.getElementById('u-meta-color');
      if(d) d.media = next==='dark'?'all':(next==='light'?'not all':'(prefers-color-scheme: dark)');
      var dark=next==='dark'||(next==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.darkmode=dark?'true':'false';
      if(m) m.content=dark?'#131416':'#ffffff';
    });
  })();
</script>
<script src="/openwrt-21.02-themes/playground/picker.js"></script></body>
</html>
