							<svg class="i-light" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.4"/><line x1="9" y1="1" x2="9" y2="3"/><line x1="9" y1="15" x2="9" y2="17"/><line x1="2.9" y1="2.9" x2="4.3" y2="4.3"/><line x1="13.7" y1="13.7" x2="15.1" y2="15.1"/><line x1="1" y1="9" x2="3" y2="9"/><line x1="15" y1="9" x2="17" y2="9"/><line x1="2.9" y1="15.1" x2="4.3" y2="13.7"/><line x1="13.7" y1="4.3" x2="15.1" y2="2.9"/></svg>
							<svg class="i-dark" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 10A7 7 0 017 1.5 7.5 7.5 0 1015.5 10Z"/></svg>

						<script>
						(function() {
							var btn = document.getElementById('p21-scheme'), root = document.documentElement,
							    link = document.getElementById('p21-dark'), mq = window.matchMedia('(prefers-color-scheme: dark)'),
							    names = { auto: '<%:Follow the browser%>', light: '<%:Light%>', dark: '<%:Dark%>' };
							function apply(mode) {
								link.media = mode == 'dark' ? 'all' : (mode == 'light' ? 'not all' : '(prefers-color-scheme: dark)');
								root.setAttribute('data-scheme', mode);
								root.setAttribute('data-darkmode', (mode == 'dark' || (mode == 'auto' && mq.matches)) ? 'true' : 'false');
								btn.title = '<%:Colour scheme%>: ' + names[mode];
								btn.setAttribute('aria-label', btn.title);
							}
							apply(root.getAttribute('data-scheme') || 'auto');
							btn.addEventListener('click', function() {
								var order = ['auto', 'light', 'dark'], next = order[(order.indexOf(root.getAttribute('data-scheme')) + 1) % 3];
								try { localStorage.setItem('@ID@.scheme', next); } catch (e) {}
								apply(next);
							});
							mq.addEventListener('change', function() { if (root.getAttribute('data-scheme') == 'auto') apply('auto'); });
						})();
						</script>
